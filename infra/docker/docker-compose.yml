services:
  app:
    container_name: kmkkm-app
    build:
      context: ../..
      dockerfile: src/KMKKM.PortalClient.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=kmkkm_portal_client;Username=kmkkm;Password=kmkkm123
      OpenClaw__BaseUrl: http://openclaw-agent:8082
      OpenClaw__ApiKey: local-dev-key
      OpenClaw__EnableTicketAutomation: "false"
      UpdateServer__BaseUrl: http://update:8081
      UpdateServer__CurrentChannel: stable
      UpdateServer__EnableAutoUpdatePrompt: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      update:
        condition: service_healthy
      openclaw-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - kmkkm-backbone

  postgres:
    container_name: kmkkm-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kmkkm_portal_client
      POSTGRES_USER: kmkkm
      POSTGRES_PASSWORD: kmkkm123
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmkkm -d kmkkm_portal_client"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - kmkkm-backbone

  update:
    container_name: kmkkm-update
    build:
      context: ../..
      dockerfile: infra/docker/update-service/Dockerfile
    environment:
      UPDATE_CURRENT_VERSION: 0.1.0
      UPDATE_TARGET_VERSION: 0.1.0
      UPDATE_CHANNEL: stable
      UPDATE_REQUIRES_ADMIN_APPROVAL: "true"
      UPDATE_GIT_PROVIDER: github
      UPDATE_GIT_REPOSITORY: your-org/kmkkm_PortalClient
      UPDATE_GIT_BRANCH: main
      UPDATE_CURRENT_COMMIT: local-dev
      UPDATE_GIT_TOKEN: ""
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - kmkkm-backbone

  openclaw-agent:
    container_name: kmkkm-openclaw-agent
    build:
      context: ../..
      dockerfile: infra/docker/openclaw-agent/Dockerfile
    environment:
      OPENCLAW_AGENT_NAME: KMKKM OpenClaw Agent
      OPENCLAW_DEFAULT_MODEL: openclaw-local
      OPENCLAW_DEFAULT_QUEUE: suporte
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - kmkkm-backbone

networks:
  kmkkm-backbone:
    driver: bridge

volumes:
  postgres-data:
