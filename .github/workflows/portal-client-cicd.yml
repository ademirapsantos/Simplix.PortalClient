name: portal-client-cicd

on:
  push:
    branches:
      - dev
      - release
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  version:
    runs-on:
      - self-hosted
      - Linux
      - X64
    outputs:
      version: ${{ steps.meta.outputs.version }}
      assembly_version: ${{ steps.meta.outputs.assembly_version }}
      file_version: ${{ steps.meta.outputs.file_version }}
      informational_version: ${{ steps.meta.outputs.informational_version }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      deploy_env: ${{ steps.branch.outputs.deploy_env }}
      git_branch: ${{ steps.branch.outputs.git_branch }}
      image_name: ${{ steps.image.outputs.image_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: branch
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          case "$BRANCH_NAME" in
            main) echo "deploy_env=prd" >> "$GITHUB_OUTPUT" ;;
            release) echo "deploy_env=hmg" >> "$GITHUB_OUTPUT" ;;
            *) echo "deploy_env=dev" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "git_branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - id: image
        shell: bash
        run: |
          echo "image_name=${GITHUB_REPOSITORY,,}/portal-client-app" >> "$GITHUB_OUTPUT"

      - id: meta
        shell: pwsh
        run: |
          $output = ./scripts/ci/compute-version.ps1 -BranchName "${{ steps.branch.outputs.git_branch }}" -Sha "${{ github.sha }}" -RunNumber ${{ github.run_number }}
          foreach ($line in $output) {
            $line >> $env:GITHUB_OUTPUT
          }

  build:
    runs-on:
      - self-hosted
      - Linux
      - X64
    needs: version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: /home/actions/.dotnet
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Simplix.PortalClient.sln

      - name: Build
        run: >
          dotnet build Simplix.PortalClient.sln
          --configuration Release
          /p:Version=${{ needs.version.outputs.version }}
          /p:AssemblyVersion=${{ needs.version.outputs.assembly_version }}
          /p:FileVersion=${{ needs.version.outputs.file_version }}
          /p:InformationalVersion=${{ needs.version.outputs.informational_version }}
          /p:SourceRevisionId=${{ github.sha }}

      - name: Test
        run: dotnet test Simplix.PortalClient.sln --configuration Release --no-build

  publish-image:
    runs-on:
      - self-hosted
      - Linux
      - X64
    needs:
      - version
      - build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Simplix.PortalClient.Web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.version.outputs.image_name }}:${{ needs.version.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ needs.version.outputs.image_name }}:${{ needs.version.outputs.git_branch }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}

  deploy-local:
    runs-on:
      - self-hosted
      - Linux
      - X64
    needs:
      - version
      - publish-image
    if: ${{ needs.version.outputs.deploy_env == 'dev' || needs.version.outputs.deploy_env == 'hmg' }}
    environment: ${{ needs.version.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY_INPUT: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY_INPUT" ]; then
            echo "DEPLOY_SSH_KEY not configured. SSH key preparation skipped."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY_INPUT" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Validate deploy config
        id: deploy_config
        shell: bash
        env:
          DEPLOY_HOST_INPUT: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_USER_INPUT: ${{ secrets.DEPLOY_USER != '' && secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          DEPLOY_PATH_INPUT: ${{ secrets.DEPLOY_PATH != '' && secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT_INPUT: ${{ secrets.DEPLOY_PORT != '' && secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY_INPUT: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST_INPUT" ] || [ -z "$DEPLOY_USER_INPUT" ] || [ -z "$DEPLOY_SSH_KEY_INPUT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deploy skipped: missing DEPLOY_HOST, DEPLOY_USER or DEPLOY_SSH_KEY in environment '${{ needs.version.outputs.deploy_env }}'."
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "host=$DEPLOY_HOST_INPUT" >> "$GITHUB_OUTPUT"
          echo "user=$DEPLOY_USER_INPUT" >> "$GITHUB_OUTPUT"
          echo "path=${DEPLOY_PATH_INPUT:-/opt/simplix/portal-client}" >> "$GITHUB_OUTPUT"
          echo "port=${DEPLOY_PORT_INPUT:-22}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: ${{ steps.deploy_config.outputs.configured == 'true' }}
        shell: bash
        env:
          REMOTE_HOST: ${{ steps.deploy_config.outputs.host }}
          REMOTE_USER: ${{ steps.deploy_config.outputs.user }}
          REMOTE_PATH: ${{ steps.deploy_config.outputs.path }}
          REMOTE_PORT: ${{ steps.deploy_config.outputs.port }}
          DEPLOY_ENV: ${{ needs.version.outputs.deploy_env }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ needs.version.outputs.image_tag }}
          SOURCE_REVISION: ${{ github.sha }}
          GIT_BRANCH: ${{ needs.version.outputs.git_branch }}
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ needs.version.outputs.image_name }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_USERNAME || vars.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: bash ./scripts/ci/deploy-container.sh

  deploy-remote:
    runs-on:
      - self-hosted
      - Linux
      - X64
    needs:
      - version
      - publish-image
    if: ${{ needs.version.outputs.deploy_env == 'prd' }}
    environment: ${{ needs.version.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY_INPUT: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY_INPUT" ]; then
            echo "DEPLOY_SSH_KEY not configured. SSH key preparation skipped."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY_INPUT" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Validate deploy config
        id: deploy_config
        shell: bash
        env:
          DEPLOY_HOST_INPUT: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_USER_INPUT: ${{ secrets.DEPLOY_USER != '' && secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          DEPLOY_PATH_INPUT: ${{ secrets.DEPLOY_PATH != '' && secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT_INPUT: ${{ secrets.DEPLOY_PORT != '' && secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY_INPUT: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST_INPUT" ] || [ -z "$DEPLOY_USER_INPUT" ] || [ -z "$DEPLOY_SSH_KEY_INPUT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deploy skipped: missing DEPLOY_HOST, DEPLOY_USER or DEPLOY_SSH_KEY in environment '${{ needs.version.outputs.deploy_env }}'."
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "host=$DEPLOY_HOST_INPUT" >> "$GITHUB_OUTPUT"
          echo "user=$DEPLOY_USER_INPUT" >> "$GITHUB_OUTPUT"
          echo "path=${DEPLOY_PATH_INPUT:-/opt/simplix/portal-client}" >> "$GITHUB_OUTPUT"
          echo "port=${DEPLOY_PORT_INPUT:-22}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: ${{ steps.deploy_config.outputs.configured == 'true' }}
        shell: bash
        env:
          REMOTE_HOST: ${{ steps.deploy_config.outputs.host }}
          REMOTE_USER: ${{ steps.deploy_config.outputs.user }}
          REMOTE_PATH: ${{ steps.deploy_config.outputs.path }}
          REMOTE_PORT: ${{ steps.deploy_config.outputs.port }}
          DEPLOY_ENV: ${{ needs.version.outputs.deploy_env }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ needs.version.outputs.image_tag }}
          SOURCE_REVISION: ${{ github.sha }}
          GIT_BRANCH: ${{ needs.version.outputs.git_branch }}
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ needs.version.outputs.image_name }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_USERNAME || vars.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: bash ./scripts/ci/deploy-container.sh
