name: portal-client-cicd

on:
  push:
    branches:
      - dev
      - release
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      assembly_version: ${{ steps.meta.outputs.assembly_version }}
      file_version: ${{ steps.meta.outputs.file_version }}
      informational_version: ${{ steps.meta.outputs.informational_version }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      deploy_env: ${{ steps.branch.outputs.deploy_env }}
      git_branch: ${{ steps.branch.outputs.git_branch }}
      image_name: ${{ steps.image.outputs.image_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: branch
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          case "$BRANCH_NAME" in
            main) echo "deploy_env=prd" >> "$GITHUB_OUTPUT" ;;
            release) echo "deploy_env=hmg" >> "$GITHUB_OUTPUT" ;;
            *) echo "deploy_env=dev" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "git_branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - id: image
        shell: bash
        run: |
          echo "image_name=${GITHUB_REPOSITORY,,}/portal-client-app" >> "$GITHUB_OUTPUT"

      - id: meta
        shell: pwsh
        run: |
          $output = ./scripts/ci/compute-version.ps1 -BranchName "${{ steps.branch.outputs.git_branch }}" -Sha "${{ github.sha }}" -RunNumber ${{ github.run_number }}
          foreach ($line in $output) {
            $line >> $env:GITHUB_OUTPUT
          }

  build:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore KMKKM.PortalClient.sln

      - name: Build
        run: >
          dotnet build KMKKM.PortalClient.sln
          --configuration Release
          /p:Version=${{ needs.version.outputs.version }}
          /p:AssemblyVersion=${{ needs.version.outputs.assembly_version }}
          /p:FileVersion=${{ needs.version.outputs.file_version }}
          /p:InformationalVersion=${{ needs.version.outputs.informational_version }}
          /p:SourceRevisionId=${{ github.sha }}

      - name: Test
        run: dotnet test KMKKM.PortalClient.sln --configuration Release --no-build

  publish-image:
    runs-on: ubuntu-latest
    needs:
      - version
      - build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/KMKKM.PortalClient.Web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.version.outputs.image_name }}:${{ needs.version.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ needs.version.outputs.image_name }}:${{ needs.version.outputs.git_branch }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - version
      - publish-image
    environment: ${{ needs.version.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy
        shell: bash
        env:
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_ENV: ${{ needs.version.outputs.deploy_env }}
          IMAGE_TAG: ${{ needs.version.outputs.image_tag }}
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ needs.version.outputs.image_name }}
        run: ./scripts/ci/deploy-container.sh
